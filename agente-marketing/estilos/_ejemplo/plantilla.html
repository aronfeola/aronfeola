<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Estilo _ejemplo</title>
<style>
  @font-face { font-family: 'Anton'; font-weight: 400; font-style: normal; src: url('../_fuentes/Anton-400.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 500; font-style: normal; src: url('../_fuentes/Inter-500.ttf'); }
  @font-face { font-family: 'Inter'; font-weight: 800; font-style: normal; src: url('../_fuentes/Inter-800.ttf'); }

  :root {
    --w: 1080px; --h: 1350px;
    --color-fondo: #101012;
    --color-acento: #ffd400;     /* titular, sello y botón */
    --color-texto: #f2f0ea;      /* subtítulo */
    --color-sobre-acento: #101012;
    --fuente-titulo: 'Anton', Impact, sans-serif;
    --fuente-cuerpo: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--color-fondo); }
  /* Layout en columna: todo tiene alto fijo menos la foto, que se estira. Así el mismo estilo
     sirve en 4:5, 1:1 y 9:16 (el alto cambia y la foto absorbe la diferencia). */
  #lienzo { position: relative; width: var(--w); height: var(--h); padding: 64px 72px 68px; display: flex; flex-direction: column; }

  [data-texto="titular"] {
    flex: none; height: 282px; margin-bottom: 188px; overflow: hidden;
    font: 400 148px/0.95 var(--fuente-titulo); letter-spacing: 1px; text-transform: uppercase;
    color: var(--color-acento);
  }
  .zona-foto { position: relative; flex: 1; min-height: 200px; margin-bottom: 30px; }
  [data-foto="producto"] {
    position: absolute; inset: 0; border-radius: 36px; background: #333 center / cover no-repeat;
  }
  [data-texto="sello"] {                       /* sobresale 72 px arriba y 2 px a la derecha de la foto */
    position: absolute; right: -2px; top: -72px; width: 210px; height: 210px; border-radius: 50%;
    background: var(--color-acento); color: var(--color-sobre-acento);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font: 800 40px/1.05 var(--fuente-cuerpo); text-transform: uppercase;
  }
  [data-texto="subtitulo"] {
    flex: none; height: 50px; margin-bottom: 36px; overflow: hidden; white-space: nowrap;
    font: 500 38px/1.3 var(--fuente-cuerpo); color: var(--color-texto);
  }
  [data-texto="cta"] {
    flex: none; height: 112px; border-radius: 20px;
    background: var(--color-acento); color: var(--color-sobre-acento);
    font: 400 56px/112px var(--fuente-titulo); letter-spacing: 2px; text-align: center; text-transform: uppercase;
    white-space: nowrap; overflow: hidden;
  }

  /* Variante cuadrada: menos aire entre el titular y la foto. */
  body[data-ratio="1x1"] [data-texto="titular"] { margin-bottom: 96px; }
</style>
</head>
<body>
  <div id="lienzo">
    <div data-texto="titular" data-fit>Regalos con<br>tu logo en 3D</div>
    <div class="zona-foto">
      <div data-foto="producto"></div>
      <div data-texto="sello" data-opcional>10 días<br>hábiles</div>
    </div>
    <div data-texto="subtitulo" data-fit data-opcional>Muestra antes de confirmar tu pedido</div>
    <div data-texto="cta" data-fit>Pedí tu presupuesto</div>
  </div>
</body>
</html>
